name: Package for Windows
description: Create a Windows package for PXL-Cone

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  azure-client-id:
    description: Client ID for the Azure Signer Application
    required: false
  azure-tenant-id:
    description: Tenant ID for the Azure Signer Application
    required: false
  azure-subscription-id:
    description: Subscription ID for the Azure Signer Application
    required: false
  signing-enabled:
    description: Explicitly enable signing with the repository owner's Azure configuration
    required: false
    default: 'false'
  signing-endpoint:
    description: Owner's Azure Artifact Signing endpoint
    required: false
  signing-account:
    description: Owner's Artifact Signing account name
    required: false
  signing-profile:
    description: Owner's certificate profile name
    required: false

runs:
  using: composite

  steps:
    - name: Check Windows resource version
      shell: pwsh
      run: python tests/WindowsVersion_test.py

    - name: Check alpha asset staging
      shell: pwsh
      run: python tests/AlphaAssets_test.py

    - name: Validate signing configuration
      id: signing
      shell: pwsh
      env:
        PXL_SIGNING_ENABLED: ${{ inputs.signing-enabled }}
        PXL_SIGNING_ENDPOINT: ${{ inputs.signing-endpoint }}
        PXL_SIGNING_ACCOUNT: ${{ inputs.signing-account }}
        PXL_SIGNING_PROFILE: ${{ inputs.signing-profile }}
        PXL_AZURE_CLIENT: ${{ inputs.azure-client-id }}
        PXL_AZURE_TENANT: ${{ inputs.azure-tenant-id }}
        PXL_AZURE_SUBSCRIPTION: ${{ inputs.azure-subscription-id }}
      run: |
        if ($env:PXL_SIGNING_ENABLED -ne 'true') {
          'enabled=false' >> $env:GITHUB_OUTPUT
          ':warning: Windows packages are unsigned. Owner code signing is not enabled.' >> $env:GITHUB_STEP_SUMMARY
          exit 0
        }
        $required = @('PXL_SIGNING_ENDPOINT', 'PXL_SIGNING_ACCOUNT', 'PXL_SIGNING_PROFILE',
                      'PXL_AZURE_CLIENT', 'PXL_AZURE_TENANT', 'PXL_AZURE_SUBSCRIPTION')
        foreach ($name in $required) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Signing was enabled but $name is missing. Configure the owner's signing service or disable signing."
          }
        }
        'enabled=true' >> $env:GITHUB_OUTPUT

    - name: Test package manifest helper
      shell: pwsh
      run: ./tests/PackageManifest_test.ps1

    - name: Package (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

    - name: Package (MSVC)
      if: ${{ inputs.msystem == '' }}
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ github.workspace }}

    - name: Write binary package manifest
      shell: pwsh
      run: ./scripts/write-package-manifest.ps1 -PackageRoot install

    - name: Login to Azure
      if: ${{ steps.signing.outputs.enabled == 'true' }}
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Sign executables
      if: ${{ steps.signing.outputs.enabled == 'true' }}
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.signing-endpoint }}
        trusted-signing-account-name: ${{ inputs.signing-account }}
        certificate-profile-name: ${{ inputs.signing-profile }}
        files-folder: ${{ github.workspace }}\install\
        files-folder-filter: dll,exe
        files-folder-recurse: true
        files-folder-depth: 2
        # recommended in https://github.com/Azure/artifact-signing-action#timestamping-1
        timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
        timestamp-digest: 'SHA256'
        # TODO(@getchoo): Is this all really needed???
        # https://github.com/Azure/trusted-signing-action/blob/fc390cf8ed0f14e248a542af1d838388a47c7a7c/docs/OIDC.md
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Package (MinGW, portable)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cp -r ${{ env.INSTALL_DIR }} ${{ env.INSTALL_PORTABLE_DIR }}  # cmake install on Windows is slow, let's just copy instead
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

    - name: Package (MSVC, portable)
      if: ${{ inputs.msystem == '' }}
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cp -r ${{ env.INSTALL_DIR }} ${{ env.INSTALL_PORTABLE_DIR }}  # cmake install on Windows is slow, let's just copy instead
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

    - name: Write portable package manifest
      shell: pwsh
      run: ./scripts/write-package-manifest.ps1 -PackageRoot install-portable

    - name: Package (installer)
      shell: pwsh
      env:
        BUILD_DIR: build
        INSTALL_DIR: install

        NSCURL_VERSION: "v24.9.26.122"
        NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
      run: |
        New-Item -Name NSISPlugins -ItemType Directory
        Invoke-Webrequest https://github.com/negrutiu/nsis-nscurl/releases/download/"${{ env.NSCURL_VERSION }}"/NScurl.zip -OutFile NSISPlugins\NScurl.zip
        $nscurl_hash = Get-FileHash NSISPlugins\NScurl.zip -Algorithm Sha256 | Select-Object -ExpandProperty Hash
        if ( $nscurl_hash -ne "${{ env.nscurl_sha256 }}") {
          echo "::error:: NSCurl.zip sha256 mismatch"
          exit 1
        }
        Expand-Archive -Path NSISPlugins\NScurl.zip -DestinationPath NSISPlugins\NScurl

        cd ${{ env.INSTALL_DIR }}
        makensis -NOCD "${{ github.workspace }}/${{ env.BUILD_DIR }}/program_info/win_install.nsi"

    - name: Sign installer
      if: ${{ steps.signing.outputs.enabled == 'true' }}
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.signing-endpoint }}
        trusted-signing-account-name: ${{ inputs.signing-account }}
        certificate-profile-name: ${{ inputs.signing-profile }}

        files: |
          ${{ github.workspace }}\PXL-Cone-Setup.exe

        # recommended in https://github.com/Azure/artifact-signing-action#timestamping-1
        timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
        timestamp-digest: 'SHA256'
        # TODO(@getchoo): Is this all really needed???
        # https://github.com/Azure/trusted-signing-action/blob/fc390cf8ed0f14e248a542af1d838388a47c7a7c/docs/OIDC.md
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    - name: Upload binary zip
      uses: actions/upload-artifact@v7
      with:
        name: PXL-Cone-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: install/**

    - name: Upload portable zip
      uses: actions/upload-artifact@v7
      with:
        name: PXL-Cone-${{ inputs.artifact-name }}-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: install-portable/**

    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: PXL-Cone-${{ inputs.artifact-name }}-Setup-${{ inputs.version }}-${{ inputs.build-type }}
        path: PXL-Cone-Setup.exe
